description = "Mark AI-generated images for the EU AI Act (Article 50): invisible watermark + signed C2PA Content Credentials, saved straight from your workflow. Plus a watermark verify node."
version = "0.1.0"
license = { file = "LICENSE" }
# Standard library + what ComfyUI already ships (torch, numpy, Pillow).
dependencies = []

[project.urls]
